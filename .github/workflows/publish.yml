name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false

      - name: Tag matches version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version v${version}"
            exit 1
          fi

      - name: Install
        run: uv sync --locked --all-groups

      - name: Lint
        run: |
          ./scripts/lint_imports.sh
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy .

      - name: Unit tests
        run: uv run --locked pytest --disable-socket --allow-unix-socket tests/unit_tests

      - name: Build
        run: uv build --build-constraint build-constraints.txt --require-hashes

      - name: Check distributions
        run: uvx twine==7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-cleave
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
